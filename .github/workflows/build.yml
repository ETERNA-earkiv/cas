name: Build

permissions:
  contents: write
  packages: write

env:
  JAVA_OPTS: "-Xms512m -Xmx6048m -Xss128m -XX:ReservedCodeCacheSize=512m -XX:+UseG1GC"
  GRADLE_OPTS: "-Xms512m -Xmx6048m -Xss128m -XX:ReservedCodeCacheSize=512m -XX:+UseG1GC"
  TERM: xterm-256color

on:
  push:
    tags:
      - "v*"
    branches-ignore:
      - "**"

concurrency:
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}"
  cancel-in-progress: ${{ github.event_name == 'push' }}
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'corretto'

      - name: Extract Gradle Properties
        uses: guillermocalvo/gradle-properties@v3
        id: properties
        with:
          output_file: ${{ github.output }}
          export: containerImageOrg,containerImageName,version

      - name: Build container
        run: ./gradlew casBuildDockerImage --no-daemon

      - name: Transform repository owner to lowercase
        run: |
          echo "REPOSITORY_OWNER_LC=${REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
        env:
          REPOSITORY_OWNER: '${{ github.repository_owner }}'

      - name: Docker extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPOSITORY_OWNER_LC }}/${{ steps.properties.outputs.containerImageName }}
          tags: |
            type=semver,pattern=v{{version }}
            type=semver,pattern=v{{major }}.{{minor }}
            type=semver,pattern=v{{major }}
          flavor: |
            latest=false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag
        run: |
          docker tag ${{ steps.properties.outputs.containerImageOrg }}/${{ steps.properties.outputs.containerImageName }}:${{ steps.properties.outputs.version }} ghcr.io/${{ env.REPOSITORY_OWNER_LC }}/${{ steps.properties.outputs.containerImageName }}:${{ steps.meta.outputs.version }}

      - name: Push image
        run: |
          docker push ghcr.io/${{ env.REPOSITORY_OWNER_LC }}/${{ steps.properties.outputs.containerImageName }}:${{ steps.meta.outputs.version }}

      - name: Push tags
        uses: akhilerm/tag-push-action@v2.1.0
        with:
          src: ghcr.io/${{ env.REPOSITORY_OWNER_LC }}/${{ steps.properties.outputs.containerImageName }}:${{ steps.meta.outputs.version }}
          dst: ${{ steps.meta.outputs.tags }}